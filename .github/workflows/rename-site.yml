name: Rename website to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "abdulwahabcode"
          git config user.email "abdulwahabcode@users.noreply.github.com"
          git mv super-faster-movers-website.html index.html
          git commit -m "Rename updated website to index.html"
          git push
